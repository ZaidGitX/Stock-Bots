[project]
name = "stockbots"
version = "3.0.0"
description = "Tools for stock similarity, forecasting, and visualization"
developers = [{ name = "Zaid Ahmed", email = "zahmed1@uncc.edu }]
readme = "README.md"
requires-python = ">=3.9"


dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "scikit-surprise>=1.1.3", "statsmodels>=0.14", "pmdarima>=2.0", "joblib>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ipykernel", "black", "ruff"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
streamlit = ["streamlit>=1.34"]
viz = ["seaborn>=0.13"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"





